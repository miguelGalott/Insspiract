name: primeiro_app
description: "Programa feito por nois"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.1.2
  fl_chart: ^0.69.0
  sqflite: ^2.4.2+1
  path: ^1.9.1
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8


flutter:
  uses-material-design: true


flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21

  flutter_native_splash:
    color: "#0b3c7d"
    image: assets/logo.png

    color_dark: "#121212"
    image_dark: assets/app_icon.png